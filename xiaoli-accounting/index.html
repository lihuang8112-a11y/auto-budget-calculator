    :root{--ink:#1f2430;--muted:#687083;--violet:#6455e8;--blue:#1682f2;--surface:#f7f8ff;--line:#e5e7f2}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff 0%,var(--surface) 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.shell{width:min(1120px,calc(100% - 40px));margin:auto}header{display:flex;align-items:center;justify-content:space-between;padding:24px 0}.back{color:var(--muted);font-size:14px;text-decoration:none}.brand{font-weight:800;letter-spacing:.2px}.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,1.2fr);gap:58px;align-items:center;padding:50px 0 70px}.eyebrow{display:inline-block;margin-bottom:14px;color:var(--violet);font-size:14px;font-weight:750;letter-spacing:.05em}.hero h1{max-width:480px;margin:0 0 20px;font-size:clamp(38px,5vw,63px);letter-spacing:-.06em;line-height:1.08}.intro{max-width:470px;margin:0;color:var(--muted);font-size:17px;line-height:1.9}.download{display:inline-flex;align-items:center;gap:11px;margin-top:31px;padding:15px 22px;border-radius:12px;background:linear-gradient(120deg,var(--violet),var(--blue));color:#fff;font-weight:800;text-decoration:none;box-shadow:0 14px 30px rgba(74,81,222,.24)}.hint{margin-top:13px;color:#9298a8;font-size:13px}.case{padding:10px;border:1px solid var(--line);border-radius:21px;background:#fff;box-shadow:0 26px 65px rgba(67,73,132,.13)}.case img{display:block;width:100%;border-radius:13px}.features{padding:52px 0 80px;border-top:1px solid var(--line)}.features h2{margin:0 0 25px;font-size:25px}.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.feature{padding:23px;border:1px solid var(--line);border-radius:15px;background:#fff}.feature strong{display:block;margin-bottom:9px;font-size:16px}.feature p{margin:0;color:var(--muted);font-size:14px;line-height:1.75}.privacy{margin:20px 0 0;color:var(--muted);font-size:14px;line-height:1.75}@media(max-width:760px){.shell{width:min(100% - 30px,1120px)}header{padding:18px 0}.hero{grid-template-columns:1fr;gap:32px;padding:32px 0 50px}.hero h1{font-size:43px}.intro{font-size:16px}.case{order:-1}.feature-grid{grid-template-columns:1fr}.features{padding:40px 0 58px}}

<style>html.access-locked body>*:not(#accessGate){display:none!important}#accessGate{position:fixed;z-index:9999;inset:0;display:grid;place-items:center;padding:24px;background:#f5f8f6;color:#17221f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.gate-card{box-sizing:border-box;width:min(100%,390px);padding:34px;border:1px solid #dce4df;border-radius:16px;background:#fff;box-shadow:0 22px 60px rgba(23,50,40,.12)}.gate-logo{display:block;width:52px;height:52px;margin-bottom:22px;border-radius:12px;object-fit:cover}.gate-card h1{margin:0 0 8px;font-size:25px}.gate-card p{margin:0 0 24px;color:#6f7c77;line-height:1.6}.gate-card label{display:block;margin-bottom:8px;font-size:14px;font-weight:650}.gate-row{display:flex;gap:10px}.gate-row input{box-sizing:border-box;min-width:0;height:46px;flex:1;padding:0 13px;border:1px solid #dce4df;border-radius:9px;outline:0;font:inherit}.gate-row input:focus{border-color:#087a62;box-shadow:0 0 0 3px rgba(8,122,98,.1)}.gate-row button{height:46px;padding:0 18px;border:0;border-radius:9px;background:#087a62;color:#fff;font:inherit;font-weight:700;cursor:pointer}.gate-row button:disabled{opacity:.6;cursor:wait}.gate-error{min-height:20px;margin-top:10px!important;margin-bottom:0!important;color:#c43f35!important;font-size:13px}.gate-note{margin-top:16px!important;margin-bottom:0!important;font-size:12px}html:not(.access-locked) #accessGate{display:none}@media(max-width:520px){.gate-card{padding:28px 22px}.gate-row{align-items:stretch;flex-direction:column}.gate-row button{width:100%}}</style>

  &lt;/style&gt;

  &lt;div class=&quot;topline&quot;&gt;
    &lt;div&gt;&lt;h2&gt;自动提升预算计算器&lt;/h2&gt;&lt;p class=&quot;sub&quot;&gt;当前投产达到阈值后，按预测投产估算提升后的销售额&lt;/p&gt;&lt;/div&gt;
    &lt;span class=&quot;status ok&quot; id=&quot;status&quot;&gt;达到触发条件&lt;/span&gt;
  &lt;/div&gt;

  &lt;div class=&quot;controls&quot;&gt;
    &lt;label&gt;初始日预算&lt;div class=&quot;input-wrap&quot;&gt;&lt;input id=&quot;initial&quot; type=&quot;number&quot; value=&quot;1000&quot; min=&quot;0&quot; step=&quot;100&quot;&gt;&lt;span class=&quot;unit&quot;&gt;元&lt;/span&gt;&lt;/div&gt;&lt;/label&gt;
    &lt;label&gt;单次提升幅度&lt;div class=&quot;input-wrap&quot;&gt;&lt;input id=&quot;rate&quot; type=&quot;number&quot; value=&quot;10&quot; min=&quot;0&quot; max=&quot;500&quot; step=&quot;1&quot;&gt;&lt;span class=&quot;unit&quot;&gt;%&lt;/span&gt;&lt;/div&gt;&lt;/label&gt;
    &lt;label&gt;当前（原本）投入产出比&lt;div class=&quot;input-wrap&quot;&gt;&lt;input id=&quot;currentRoas&quot; type=&quot;number&quot; value=&quot;2&quot; min=&quot;0&quot; step=&quot;0.1&quot;&gt;&lt;span class=&quot;unit&quot;&gt;ROAS&lt;/span&gt;&lt;/div&gt;&lt;/label&gt;
    &lt;label&gt;触发提升的最低投入产出比&lt;div class=&quot;input-wrap&quot;&gt;&lt;input id=&quot;triggerRoas&quot; type=&quot;number&quot; value=&quot;2&quot; min=&quot;0&quot; step=&quot;0.1&quot;&gt;&lt;span class=&quot;unit&quot;&gt;ROAS&lt;/span&gt;&lt;/div&gt;&lt;/label&gt;
    &lt;label&gt;提升后预测投入产出比&lt;div class=&quot;input-wrap&quot;&gt;&lt;input id=&quot;forecastRoas&quot; type=&quot;number&quot; value=&quot;1.8&quot; min=&quot;0&quot; step=&quot;0.1&quot;&gt;&lt;span class=&quot;unit&quot;&gt;ROAS&lt;/span&gt;&lt;/div&gt;&lt;/label&gt;
    &lt;label&gt;最多修改次数&lt;div class=&quot;input-wrap&quot;&gt;&lt;input id=&quot;maxChanges&quot; type=&quot;number&quot; value=&quot;8&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;1&quot;&gt;&lt;span class=&quot;unit&quot;&gt;次&lt;/span&gt;&lt;/div&gt;&lt;/label&gt;
    &lt;div class=&quot;range-row&quot;&gt;
      &lt;div class=&quot;range-head&quot;&gt;&lt;label for=&quot;triggers&quot;&gt;计划提升次数&lt;/label&gt;&lt;strong id=&quot;triggerValue&quot;&gt;8 次&lt;/strong&gt;&lt;/div&gt;
      &lt;input id=&quot;triggers&quot; type=&quot;range&quot; value=&quot;8&quot; min=&quot;0&quot; max=&quot;8&quot; step=&quot;1&quot;&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;results&quot;&gt;
    &lt;div class=&quot;metric primary&quot;&gt;&lt;span&gt;预计最终花费上限&lt;/span&gt;&lt;strong id=&quot;finalBudget&quot;&gt;¥2,143.59&lt;/strong&gt;&lt;/div&gt;
    &lt;div class=&quot;metric&quot;&gt;&lt;span&gt;不加预算预计销售额&lt;/span&gt;&lt;strong id=&quot;baselineSales&quot;&gt;¥2,000.00&lt;/strong&gt;&lt;/div&gt;
    &lt;div class=&quot;metric&quot;&gt;&lt;span&gt;规则执行后预计总销售额&lt;/span&gt;&lt;strong id=&quot;projectedSales&quot;&gt;¥4,058.46&lt;/strong&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;track&quot;&gt;&lt;div class=&quot;fill&quot; id=&quot;fill&quot;&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;table-wrap&quot;&gt;
    &lt;div class=&quot;table-title&quot;&gt;&lt;strong&gt;逐次预算变化&lt;/strong&gt;&lt;span id=&quot;formula&quot;&gt;1000 × 1.1⁸&lt;/span&gt;&lt;/div&gt;
    &lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;阶段&lt;/th&gt;&lt;th&gt;本次增加&lt;/th&gt;&lt;th&gt;预算上限&lt;/th&gt;&lt;th&gt;计算投产比&lt;/th&gt;&lt;th&gt;预计销售额&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;rows&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;
    &lt;p class=&quot;note&quot;&gt;当前投产达到或超过触发值时才执行预算提升。不加预算销售额＝初始预算 × 当前投产；每次提升后的预计总销售额＝不加预算销售额 ＋ 累计新增预算 × 提升后预测投产。预算按充分花完估算，且上调是替换原预算，不是累加各阶段预算。&lt;/p&gt;
  &lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;budget-calc-4cc9&#x27;);
      const q = id =&gt; root.querySelector(&#x27;#&#x27; + id);
      const ids = [&#x27;initial&#x27;,&#x27;rate&#x27;,&#x27;currentRoas&#x27;,&#x27;triggerRoas&#x27;,&#x27;forecastRoas&#x27;,&#x27;maxChanges&#x27;,&#x27;triggers&#x27;];
      const money = n =&gt; new Intl.NumberFormat(&#x27;zh-CN&#x27;, {style:&#x27;currency&#x27;, currency:&#x27;CNY&#x27;, minimumFractionDigits:2}).format(Number.isFinite(n) ? n : 0);
      const superscript = n =&gt; String(n).split(&#x27;&#x27;).map(c =&gt; &#x27;⁰¹²³⁴⁵⁶⁷⁸⁹&#x27;[Number(c)]).join(&#x27;&#x27;);
      function calculate(changed) {
        const initial = Math.max(0, +q(&#x27;initial&#x27;).value || 0);
        const rate = Math.max(0, +q(&#x27;rate&#x27;).value || 0) / 100;
        const currentRoas = Math.max(0, +q(&#x27;currentRoas&#x27;).value || 0);
        const triggerRoas = Math.max(0, +q(&#x27;triggerRoas&#x27;).value || 0);
        const forecastRoas = Math.max(0, +q(&#x27;forecastRoas&#x27;).value || 0);
        const maxChanges = Math.max(0, Math.floor(+q(&#x27;maxChanges&#x27;).value || 0));
        const slider = q(&#x27;triggers&#x27;);
        slider.max = String(maxChanges);
        if (changed === &#x27;maxChanges&#x27; || +slider.value &gt; maxChanges) slider.value = String(maxChanges);
        const requested = Math.max(0, Math.min(maxChanges, Math.floor(+slider.value || 0)));
        const eligible = currentRoas &gt;= triggerRoas;
        const effective = eligible ? requested : 0;
        const final = initial * Math.pow(1 + rate, effective);
        const baselineSales = initial * currentRoas;
        const projectedSales = effective &gt; 0 ? baselineSales + (final - initial) * forecastRoas : baselineSales;
        const status = q(&#x27;status&#x27;);
        status.textContent = eligible ? &#x27;达到触发条件&#x27; : &#x27;未达到触发条件&#x27;;
        status.className = &#x27;status &#x27; + (eligible ? &#x27;ok&#x27; : &#x27;no&#x27;);
        q(&#x27;triggerValue&#x27;).textContent = requested + &#x27; 次&#x27;;
        q(&#x27;finalBudget&#x27;).textContent = money(final);
        q(&#x27;baselineSales&#x27;).textContent = money(baselineSales);
        q(&#x27;projectedSales&#x27;).textContent = money(projectedSales);
        q(&#x27;formula&#x27;).textContent = initial.toLocaleString(&#x27;zh-CN&#x27;) + &#x27; × &#x27; + (1 + rate).toFixed(2).replace(/0+$/,&#x27;&#x27;).replace(/\.$/,&#x27;&#x27;) + superscript(effective);
        q(&#x27;fill&#x27;).style.width = maxChanges ? Math.min(100, effective / maxChanges * 100) + &#x27;%&#x27; : &#x27;0%&#x27;;
        let html = `&lt;tr&gt;&lt;td&gt;不加预算&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;${money(initial)}&lt;/td&gt;&lt;td&gt;${currentRoas.toFixed(2)}&lt;/td&gt;&lt;td&gt;${money(baselineSales)}&lt;/td&gt;&lt;/tr&gt;`;
        let previous = initial;
        for (let i = 1; i &lt;= effective; i++) {
          const current = initial * Math.pow(1 + rate, i);
          const stageSales = baselineSales + (current - initial) * forecastRoas;
          html += `&lt;tr&gt;&lt;td&gt;第 ${i} 次提升&lt;/td&gt;&lt;td&gt;+${money(current - previous)}&lt;/td&gt;&lt;td&gt;${money(current)}&lt;/td&gt;&lt;td&gt;${forecastRoas.toFixed(2)}&lt;/td&gt;&lt;td&gt;${money(stageSales)}&lt;/td&gt;&lt;/tr&gt;`;
          previous = current;
        }
        q(&#x27;rows&#x27;).innerHTML = html;
      }
      ids.forEach(id =&gt; q(id).addEventListener(&#x27;input&#x27;, () =&gt; calculate(id)));
      calculate();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

  &lt;div class=&quot;topline&quot;&gt;
    &lt;div&gt;&lt;h2&gt;自动提升预算计算器&lt;/h2&gt;&lt;p class=&quot;sub&quot;&gt;当前投产达到阈值后，按预测投产估算提升后的销售额&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;metric&quot;&gt;&lt;span&gt;规则执行后预计总销售额&lt;/span&gt;&lt;strong id=&quot;projectedSales&quot;&gt;¥4,058.46&lt;/strong&gt;&lt;/div&gt;

    &lt;p class=&quot;note&quot;&gt;当前投产达到或超过触发值时才执行预算提升。不加预算销售额＝初始预算 × 当前投产；每次提升后的预计总销售额＝不加预算销售额 ＋ 累计新增预算 × 提升后预测投产。预算按充分花完估算，且上调是替换原预算，不是累加各阶段预算。&lt;/p&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;budget-calc-4cc9&#x27;);
      const q = id =&gt; root.querySelector(&#x27;#&#x27; + id);
      const ids = [&#x27;initial&#x27;,&#x27;rate&#x27;,&#x27;currentRoas&#x27;,&#x27;triggerRoas&#x27;,&#x27;forecastRoas&#x27;,&#x27;maxChanges&#x27;,&#x27;triggers&#x27;];
      const money = n =&gt; new Intl.NumberFormat(&#x27;zh-CN&#x27;, {style:&#x27;currency&#x27;, currency:&#x27;CNY&#x27;, minimumFractionDigits:2}).format(Number.isFinite(n) ? n : 0);
      const superscript = n =&gt; String(n).split(&#x27;&#x27;).map(c =&gt; &#x27;⁰¹²³⁴⁵⁶⁷⁸⁹&#x27;[Number(c)]).join(&#x27;&#x27;);
      function calculate(changed) {
        const initial = Math.max(0, +q(&#x27;initial&#x27;).value || 0);
        const rate = Math.max(0, +q(&#x27;rate&#x27;).value || 0) / 100;
        const currentRoas = Math.max(0, +q(&#x27;currentRoas&#x27;).value || 0);
        const triggerRoas = Math.max(0, +q(&#x27;triggerRoas&#x27;).value || 0);
        const forecastRoas = Math.max(0, +q(&#x27;forecastRoas&#x27;).value || 0);
        const maxChanges = Math.max(0, Math.floor(+q(&#x27;maxChanges&#x27;).value || 0));
        const slider = q(&#x27;triggers&#x27;);
        slider.max = String(maxChanges);
        if (changed === &#x27;maxChanges&#x27; || +slider.value &gt; maxChanges) slider.value = String(maxChanges);
        const requested = Math.max(0, Math.min(maxChanges, Math.floor(+slider.value || 0)));
        const eligible = currentRoas &gt;= triggerRoas;
        const effective = eligible ? requested : 0;
        const final = initial * Math.pow(1 + rate, effective);
        const baselineSales = initial * currentRoas;
        const projectedSales = effective &gt; 0 ? baselineSales + (final - initial) * forecastRoas : baselineSales;
        const status = q(&#x27;status&#x27;);
        status.textContent = eligible ? &#x27;达到触发条件&#x27; : &#x27;未达到触发条件&#x27;;
        status.className = &#x27;status &#x27; + (eligible ? &#x27;ok&#x27; : &#x27;no&#x27;);
        q(&#x27;triggerValue&#x27;).textContent = requested + &#x27; 次&#x27;;
        q(&#x27;finalBudget&#x27;).textContent = money(final);
        q(&#x27;baselineSales&#x27;).textContent = money(baselineSales);
        q(&#x27;projectedSales&#x27;).textContent = money(projectedSales);
        q(&#x27;formula&#x27;).textContent = initial.toLocaleString(&#x27;zh-CN&#x27;) + &#x27; × &#x27; + (1 + rate).toFixed(2).replace(/0+$/,&#x27;&#x27;).replace(/\.$/,&#x27;&#x27;) + superscript(effective);
        q(&#x27;fill&#x27;).style.width = maxChanges ? Math.min(100, effective / maxChanges * 100) + &#x27;%&#x27; : &#x27;0%&#x27;;
        let html = `&lt;tr&gt;&lt;td&gt;不加预算&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;${money(initial)}&lt;/td&gt;&lt;td&gt;${currentRoas.toFixed(2)}&lt;/td&gt;&lt;td&gt;${money(baselineSales)}&lt;/td&gt;&lt;/tr&gt;`;
        let previous = initial;
        for (let i = 1; i &lt;= effective; i++) {
          const current = initial * Math.pow(1 + rate, i);
          const stageSales = baselineSales + (current - initial) * forecastRoas;
          html += `&lt;tr&gt;&lt;td&gt;第 ${i} 次提升&lt;/td&gt;&lt;td&gt;+${money(current - previous)}&lt;/td&gt;&lt;td&gt;${money(current)}&lt;/td&gt;&lt;td&gt;${forecastRoas.toFixed(2)}&lt;/td&gt;&lt;td&gt;${money(stageSales)}&lt;/td&gt;&lt;/tr&gt;`;
          previous = current;
        }
        q(&#x27;rows&#x27;).innerHTML = html;
      }
      ids.forEach(id =&gt; q(id).addEventListener(&#x27;input&#x27;, () =&gt; calculate(id)));
      calculate();
    })();
  &lt;/script&gt;

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="lihuangkj.cn 在线工具中心">
  <title>在线工具中心｜lihuangkj.cn</title>
  <style>
    :root{color-scheme:light;--ink:#162033;--muted:#687386;--blue:#4059e8;--line:#e5e9f2;--panel:#fff;--bg:#f5f7fb}
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}
    .wrap{width:min(1080px,calc(100% - 40px));margin:auto}
    header{height:72px;display:flex;align-items:center;border-bottom:1px solid var(--line);background:rgba(255,255,255,.9)}
    .brand{font-size:18px;font-weight:750;letter-spacing:.2px}
    main{padding:72px 0 90px}
    .eyebrow{display:inline-flex;padding:7px 12px;border-radius:999px;background:#e9edff;color:#3049d8;font-size:13px;font-weight:700}
    h1{max-width:760px;margin:22px 0 16px;font-size:clamp(36px,6vw,64px);line-height:1.08;letter-spacing:-1.8px}
    .lead{max-width:650px;margin:0;color:var(--muted);font-size:18px;line-height:1.8}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;margin-top:52px}
    .card{display:flex;flex-direction:column;min-height:270px;padding:30px;border:1px solid var(--line);border-radius:24px;background:var(--panel);box-shadow:0 16px 42px rgba(28,39,76,.07)}
    .icon{display:grid;width:52px;height:52px;place-items:center;border-radius:16px;background:#eef1ff;color:var(--blue);font-size:25px}
    h2{margin:24px 0 10px;font-size:24px}
    .card p{margin:0 0 26px;color:var(--muted);line-height:1.7}
    .button{display:inline-flex;align-items:center;justify-content:center;width:max-content;margin-top:auto;padding:12px 18px;border-radius:12px;background:var(--blue);color:#fff;text-decoration:none;font-weight:700;transition:.18s ease}
    .button:hover{transform:translateY(-1px);background:#3049d8}
    .soon{background:linear-gradient(135deg,#fafbff,#f2f4fa)}
    .soon .icon{background:#edf0f5;color:#7d8797}
    .tag{width:max-content;margin-top:auto;padding:8px 12px;border-radius:10px;background:#eef0f4;color:#7a8494;font-size:13px;font-weight:650}
    footer{padding:24px 0 34px;border-top:1px solid var(--line);color:#8a93a2;font-size:13px}
    @media(max-width:720px){header{height:64px}main{padding:50px 0 64px}.wrap{width:min(100% - 28px,1080px)}.grid{grid-template-columns:1fr;margin-top:36px}h1{letter-spacing:-1px}.card{min-height:245px}}
  </style>
</head>
<body>
  <header><div class="wrap brand">lihuangkj.cn · 在线工具中心</div></header>
  <main class="wrap">
    <span class="eyebrow">实用工具</span>
    <h1>让预算测算更清楚、更简单</h1>
    <p class="lead">集中管理常用业务工具。无需安装软件，打开网页即可使用。</p>
    <section class="grid" aria-label="工具列表">
      <article class="card">
        <div class="icon" aria-hidden="true">↗</div>
        <h2>自动提升预算计算器</h2>
        <p>根据初始预算、单次提升幅度和修改次数，计算每次预算变化、最终预算以及累计可能花费。</p>
        <a class="button" href="/calculator/">打开计算器&nbsp; →</a>
      </article>
      <article class="card soon">
        <div class="icon" aria-hidden="true">＋</div>
        <h2>更多工具</h2>
        <p>后续工具可以继续发布到同一个网站，并在这里统一进入。</p>
        <span class="tag">持续更新</span>
      </article>
    </section>
  </main>
  <footer><div class="wrap">© 2026 lihuangkj.cn</div></footer>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="李煌科技在线经营工具中心">
  <title>经营工具｜lihuangkj.cn</title>
  <style>
    :root{color-scheme:light;--green:#087a62;--ink:#17221f;--muted:#6f7c77;--line:#dce4df;--bg:#f7f9f7;--card:#fff;--amber:#f3b33b}
    *{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--ink);background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}a{color:inherit}
    .shell{width:min(1280px,calc(100% - 48px));margin:auto}
    header{height:108px;border-top:2px solid #edf1ee;border-bottom:1px solid var(--line);background:rgba(255,255,255,.96)}
    .header-inner{height:100%;display:flex;align-items:center;justify-content:space-between;gap:24px}
    .brand{display:flex;align-items:center;gap:16px;min-width:0}.logo{display:grid;width:58px;height:58px;flex:0 0 auto;place-items:center;border-radius:12px;background:linear-gradient(145deg,#0a8b6e,#066550);color:#fff;box-shadow:0 15px 32px rgba(8,122,98,.2);font-size:21px;font-weight:800;letter-spacing:-1px}
    .brand-name{font-size:clamp(22px,3vw,32px);font-weight:780;letter-spacing:-1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.domain{color:var(--green);font-weight:750;letter-spacing:.2px}
    main{padding:66px 0 54px}.tools-head{display:flex;align-items:center;justify-content:space-between;gap:28px;margin-bottom:28px}
    .section-title{display:flex;align-items:center;gap:14px;margin:0;font-size:23px}.section-title:before{content:"";width:5px;height:29px;border-radius:6px;background:var(--amber)}.count{color:var(--muted);font-size:15px;font-weight:600}
    .search{position:relative;width:min(100%,330px)}.search:before{content:"⌕";position:absolute;left:18px;top:50%;transform:translateY(-54%);color:#60716a;font-size:29px;line-height:1;pointer-events:none}.search input{width:100%;height:54px;padding:0 18px 0 52px;border:1px solid var(--line);border-radius:10px;outline:0;background:#fff;color:var(--ink);box-shadow:0 12px 28px rgba(28,47,40,.05);font:inherit;font-size:16px}.search input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(8,122,98,.1)}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.tool-card{position:relative;display:flex;min-height:145px;align-items:center;gap:16px;padding:23px 26px;border:1px solid var(--line);border-radius:11px;background:var(--card);box-shadow:0 14px 34px rgba(30,50,42,.07);text-decoration:none;overflow:hidden;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}.tool-card:before{content:"";position:absolute;top:0;left:22px;right:22px;height:4px;border-radius:0 0 5px 5px;background:var(--accent,var(--amber))}.tool-card:hover,.tool-card:focus-visible{transform:translateY(-2px);border-color:#c5d5ce;box-shadow:0 19px 40px rgba(30,50,42,.1);outline:0}
    .icon-box{position:relative;display:grid;width:64px;height:64px;flex:0 0 auto;place-items:center;border:1px solid #d8eae4;border-radius:12px;background:#eaf7f2;color:var(--green)}.calc-icon{width:27px;height:34px;border:3px solid currentColor;border-radius:5px;padding:4px}.calc-icon:before{content:"";display:block;height:6px;margin-bottom:4px;border:2px solid currentColor;border-radius:2px}.calc-icon:after{content:"•••\A•••";display:block;white-space:pre;text-align:center;font-size:9px;line-height:8px;letter-spacing:1px}.dot{position:absolute;right:6px;bottom:6px;width:14px;height:14px;border:3px solid #fff;border-radius:50%;background:#e96555}
    .tool-copy{min-width:0}.meta{display:block;margin-bottom:8px;color:var(--green);font-size:13px;font-weight:750}.tool-name{margin:0;font-size:19px;line-height:1.4;letter-spacing:-.2px}.arrow{margin-left:auto;color:#6f7d77;font-size:29px;font-weight:300;line-height:1}.empty{display:none;grid-column:1/-1;padding:38px;border:1px dashed #ccd7d2;border-radius:12px;color:var(--muted);text-align:center}
    footer{padding:28px 0 44px;color:#78857f;font-size:14px}footer strong{color:var(--green)}
    @media(max-width:980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:680px){.shell{width:min(100% - 28px,1280px)}header{height:84px}.logo{width:48px;height:48px;font-size:18px}.brand-name{font-size:21px}.domain{display:none}main{padding:42px 0}.tools-head{align-items:stretch;flex-direction:column;margin-bottom:20px}.search{width:100%}.grid{grid-template-columns:1fr}.tool-card{min-height:138px;padding:22px}.icon-box{width:60px;height:60px}.tool-name{font-size:18px}}
  </style>
</head>
<body>
  <header><div class="shell header-inner"><div class="brand"><div class="logo" aria-hidden="true">李煌</div><div class="brand-name">李煌科技 · 工具中心</div></div><div class="domain">lihuangkj.cn</div></div></header>
  <main class="shell">
    <div class="tools-head"><h1 class="section-title">经营工具 <span class="count" id="count">1 项</span></h1><label class="search"><span style="position:absolute;clip:rect(0,0,0,0)">搜索工具</span><input id="search" type="search" placeholder="搜索工具" autocomplete="off"></label></div>
    <section class="grid" id="toolGrid" aria-label="经营工具列表">
      <a class="tool-card" href="/calculator/" data-keywords="自动 提升 预算 计算器 投放 花费"><div class="icon-box" aria-hidden="true"><div class="calc-icon"></div><i class="dot"></i></div><div class="tool-copy"><span class="meta">投放 · 预算</span><h2 class="tool-name">自动提升<br>预算计算器</h2></div><span class="arrow" aria-hidden="true">›</span></a>
      <div class="empty" id="empty">没有找到相关工具</div>
    </section>
  </main>
  <footer class="shell"><strong>lihuangkj.cn</strong>&nbsp; · &nbsp;李煌科技工具中心</footer>
  <script>
    const input=document.getElementById('search'),cards=[...document.querySelectorAll('.tool-card')],count=document.getElementById('count'),empty=document.getElementById('empty');
    input.addEventListener('input',()=>{const term=input.value.trim().toLowerCase();let visible=0;cards.forEach(card=>{const match=!term||card.dataset.keywords.toLowerCase().includes(term)||card.textContent.toLowerCase().includes(term);card.style.display=match?'flex':'none';if(match)visible++});count.textContent=visible+' 项';empty.style.display=visible?'none':'block'});
  </script>
</body>
</html>
